# Pushes the mixer to itch.io every time main changes.
# One-time setup: add a repo secret named BUTLER_API_KEY (itch.io -> Settings -> API keys).
name: Publish to itch.io

on:
  push:
    branches: [main]
    paths: ['index.html', '*.gif', '*.webp', '.github/workflows/itch.yml']
  workflow_dispatch:

jobs:
  itch:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage only the files the game needs
        run: |
          mkdir dist
          cp index.html mixerabokalleb_logo.webp mixerabokalleb_logo.gif your_background.gif dist/

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler

      - name: Push to itch.io
        run: ./butler/butler push dist mahmoud-ismail/al-hut-audio-mixer-abo-kalleb:html --userversion "${{ github.sha }}"
